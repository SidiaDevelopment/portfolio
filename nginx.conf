server {
    listen 3339;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for build artefacts (filenames are hashed)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Standard static assets
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|otf|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Static export: try .html fallback, then a real 404 (served via error_page)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
