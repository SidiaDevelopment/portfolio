server {
    listen 3339;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. add_header is only inherited by locations that don't
    # declare their own, so the locations below set caching via `expires` only.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Long cache for build artefacts (filenames are hashed).
    # ^~ stops the regex location below from taking over these paths.
    location ^~ /_next/static/ {
        expires 1y;
    }

    # Standard static assets
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|css|js)$ {
        expires 30d;
    }

    # Static export: try .html fallback, then a real 404 (served via error_page)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
